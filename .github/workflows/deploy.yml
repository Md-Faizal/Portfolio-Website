name: Deploy Personal Site (Rust + React)

# Standardized Swarm Deployment Pipeline (modeled after MacOS & Bloomberg Terminal architecture):
# - Auto-triggers on push to master/main or 1-Click manual dispatch with dry-run support
# - Parallel Swarm execution: Node frontend build & Rust cargo compilation run concurrently
# - Full caching layer: npm module cache + Swatinem/rust-cache for sub-minute release builds
# - Artifact-driven release delivery (upload-artifact / download-artifact)
# - Dual-VM Cluster deployment: Primary (my-mac) & Standby (container-of-souls)
# - Container health smoke test validation via /api/maintenance-status

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '.editorconfig'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (Verify build and SSH connectivity without deploying)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: deploy-personal-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight-check:
    name: "🔍 Pre-Flight Secrets & Sanity Check"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Source Code"
        uses: actions/checkout@v4

      - name: "🛡️ Verify Primary VM Secrets"
        if: github.event.inputs.dry_run != 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          echo "Verifying primary deployment credentials..."
          ERRORS=0
          [ -z "$SSH_HOST" ] && echo "❌ ERROR: 'SSH_HOST' is missing in GitHub Secrets!" && ERRORS=$((ERRORS + 1))
          [ -z "$SSH_USER" ] && echo "❌ ERROR: 'SSH_USER' is missing in GitHub Secrets!" && ERRORS=$((ERRORS + 1))
          [ -z "$SSH_KEY" ] && echo "❌ ERROR: 'SSH_KEY' is missing in GitHub Secrets!" && ERRORS=$((ERRORS + 1))
          if [ $ERRORS -gt 0 ]; then
            exit 1
          fi
          echo "✅ Primary node credentials present."

  build-frontend:
    name: "🌐 Swarm Worker: Frontend Build & Admin Bundle"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Source Code"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js 20 with Dependency Caching"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: "⚡ Install & Build React Frontend and Admin Console"
        run: |
          cd frontend
          npm ci --prefer-offline
          # Build Main SPA
          npm run build
          # Build Standalone Admin Console
          npx vite build -c vite.admin.config.js
          # Synchronize dist-admin into public and dist
          cp dist-admin/admin.html ../public/admin.html
          cp -r dist-admin/assets/* ../public/assets/
          cp dist-admin/admin.html dist/admin.html
          cp -r dist-admin/assets/* dist/assets/
          cd ..

      - name: "📦 Upload Frontend Distribution Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

      - name: "📦 Upload Public Assets Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: public-assets
          path: public/
          retention-days: 1

  build-backend:
    name: "🦀 Swarm Worker: Rust Axum Compilation"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Source Code"
        uses: actions/checkout@v4

      - name: "🦀 Setup Rust Toolchain"
        uses: dtolnay/rust-toolchain@stable

      - name: "⚡ Cache Rust Dependencies & Build Artifacts"
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend-rust -> target"

      - name: "🚀 Compile & Strip Release Binary"
        run: |
          cd backend-rust
          cargo build --release
          strip target/release/personal-site-rust
          cd ..
          cp backend-rust/target/release/personal-site-rust ./personal-site-rust
          chmod +x ./personal-site-rust
          ls -lh ./personal-site-rust

      - name: "📦 Upload Backend Binary Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: personal-site-rust
          retention-days: 1

  deploy-cluster:
    name: "🚀 Swarm Deploy: Tri-Node Cluster (my-mac > cos > pro)"
    needs: [preflight-check, build-frontend, build-backend]
    if: github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "📥 Download Frontend Distribution"
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: "📥 Download Public Assets"
        uses: actions/download-artifact@v4
        with:
          name: public-assets
          path: public

      - name: "📥 Download Backend Binary"
        uses: actions/download-artifact@v4
        with:
          name: backend-binary
          path: .

      - name: "🔧 Prepare Binary & Web Assets Permissions"
        run: |
          chmod +x ./personal-site-rust
          chmod -R a+rX public frontend/dist
          ls -lh ./personal-site-rust


      - name: "🔌 Setup SSH & Deploy to Ubuntu VM"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail

          # 1. Setup SSH
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Decode Base64 or raw key
          if echo "$SSH_KEY" | grep -q "^LS0t"; then
            echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          elif echo "$SSH_KEY" | grep -q "BEGIN"; then
            echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key 2>/dev/null || echo "$SSH_KEY" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          cat << 'EOF' > ~/.ssh/config
          Host production
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            Port 22
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PubkeyAcceptedKeyTypes +ssh-rsa,rsa-sha2-256,rsa-sha2-512
            HostkeyAlgorithms +ssh-rsa,rsa-sha2-256,rsa-sha2-512
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

          TARGET_DIR="/home/ubuntu/stack/apps/personal-site"
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")

          echo "======================================================"
          echo "🚀 Tri-Node Swarm Cluster Deployment (my-mac > cos > pro)"
          echo "   Priority 1 (Active Edge)       : $SSH_USER@$SSH_HOST"
          echo "   Priority 2 (Failsafe Slot 1)   : cos @ 10.0.0.195"
          echo "   Priority 3 (Failsafe Slot 2)   : pro @ 35.208.86.56"
          echo "   Target Dir                     : $TARGET_DIR"
          echo "   Timestamp                      : $TIMESTAMP"
          echo "======================================================"

          # Step 1: Pre-flight remote directory structure on Priority 1 (my-mac)
          echo "🛡️ Step 1: Ensuring remote directory structure & permissions on my-mac..."
          ssh production "mkdir -p $TARGET_DIR/backend /home/ubuntu/stack/ops/ipc $TARGET_DIR/public $TARGET_DIR/frontend/dist"

          # Step 2: Sync release bundle to my-mac via rsync
          echo "📦 Step 2: Syncing binary, configs, and web assets to my-mac via rsync..."
          rsync -avz personal-site-rust Dockerfile docker-compose.yml ca-certificates.crt scripts production:"$TARGET_DIR/"
          rsync -avz --delete frontend/dist/ production:"$TARGET_DIR/frontend/dist/"
          rsync -avz --delete public/ production:"$TARGET_DIR/public/"

          # Step 3: Launch container on Priority 1 Node (my-mac) & cascade to cluster
          echo "🐳 Step 3: Launching Active Edge container on Priority 1 (my-mac)..."
          ssh production bash -s << 'REMOTESCRIPT'
          set -e
          TARGET_DIR="/home/ubuntu/stack/apps/personal-site"
          cd "$TARGET_DIR"

          RUNNER_SOURCE="$TARGET_DIR/scripts/stack-service-runner.sh"
          RUNNER_DEST="/home/ubuntu/stack/ops/service-runner.sh"
          if [ -f "$RUNNER_SOURCE" ]; then
            sudo cp -p "$RUNNER_DEST" "$RUNNER_DEST.bak.$(date +%Y%m%d_%H%M%S)" 2>/dev/null || true
            sudo install -o root -g root -m 0755 "$RUNNER_SOURCE" "$RUNNER_DEST.tmp"
            sudo mv "$RUNNER_DEST.tmp" "$RUNNER_DEST"
            sudo systemctl restart stack-service-runner.service 2>/dev/null || true
          fi

          # Ensure public web assets are world-readable and directories traversable for Nginx (www-data)
          chmod -R a+rX "$TARGET_DIR/public" "$TARGET_DIR/frontend/dist" 2>/dev/null || true
          chmod a+rx "$TARGET_DIR" /home/ubuntu /home/ubuntu/stack /home/ubuntu/stack/apps 2>/dev/null || true

          # Configure Docker daemon DNS resolvers for Oracle Cloud VCN if needed
          if [ ! -f /etc/docker/daemon.json ] || ! grep -q "169.254.169.254" /etc/docker/daemon.json 2>/dev/null; then
            echo "🔧 Configuring Docker daemon DNS for Oracle Cloud VCN..."
            sudo mkdir -p /etc/docker
            echo '{"dns": ["169.254.169.254", "1.1.1.1", "8.8.8.8"]}' | sudo tee /etc/docker/daemon.json > /dev/null
            sudo systemctl reload docker 2>/dev/null || sudo systemctl restart docker 2>/dev/null || true
          fi

          # Ensure telemetry SSH tunnels to cos and pro are active
          systemctl is-active --quiet cos-tunnel.service || sudo systemctl restart cos-tunnel.service 2>/dev/null || true
          systemctl is-active --quiet gcp-tunnel.service || sudo systemctl restart gcp-tunnel.service 2>/dev/null || true

          # Start container on Priority 1 (Active Edge role) — instant build in <2s with cached layers
          echo "⚡ Launching Priority 1 (my-mac) personal-site-rust container..."
          NODE_ROLE=active docker compose up -d --build --remove-orphans

          # Verify container health on Priority 1
          sleep 4
          docker ps --filter "name=personal-site-rust"
          curl -sS http://127.0.0.1:3002/api/maintenance-status || exit 1
          echo "✅ Priority 1 (my-mac) personal-site-rust is healthy and serving active traffic!"

          # Step 4: Propagate release to Priority 2 Node (cos @ 10.0.0.195 via internal Oracle VCN)
          echo "🛰️ Step 4: Propagating release to Priority 2 Failsafe Slot 1 (cos @ 10.0.0.195)..."
          if [ -f "/home/ubuntu/.ssh/cockpit-container-of-souls" ]; then
            scp -o StrictHostKeyChecking=no -i /home/ubuntu/.ssh/cockpit-container-of-souls \
              "$TARGET_DIR/personal-site-rust" ubuntu@10.0.0.195:"$TARGET_DIR/personal-site-rust.tmp"

            rsync -rlptD --omit-dir-times --no-o --no-g \
              -e "ssh -i /home/ubuntu/.ssh/cockpit-container-of-souls -o StrictHostKeyChecking=no" \
              --exclude "mail" \
              --exclude "backups" \
              --exclude "target" \
              --exclude "node_modules" \
              --exclude ".git" \
              --exclude "*.db*" \
              --exclude "*.tar.gz" \
              --exclude "public/uploads" \
              --exclude "personal-site-rust*" \
              "$TARGET_DIR/" ubuntu@10.0.0.195:"$TARGET_DIR/"

            ssh -o StrictHostKeyChecking=no -i /home/ubuntu/.ssh/cockpit-container-of-souls ubuntu@10.0.0.195 "TARGET_DIR=/home/ubuntu/stack/apps/personal-site; cd \$TARGET_DIR && mv -f personal-site-rust.tmp personal-site-rust && chmod +x personal-site-rust && chmod -R a+rX \$TARGET_DIR/public \$TARGET_DIR/frontend/dist 2>/dev/null || true && chmod a+rx \$TARGET_DIR /home/ubuntu /home/ubuntu/stack /home/ubuntu/stack/apps 2>/dev/null || true && mkdir -p backend /home/ubuntu/stack/ops/ipc && touch backend/messages.db && NODE_ROLE=failsafe docker compose up -d --build --remove-orphans && sleep 4 && curl -sS http://127.0.0.1:3002/api/maintenance-status || exit 1"
            echo "✅ Priority 2 (cos) personal-site-rust container is healthy and standing by!"
          else
            echo "⚠️ Standby key /home/ubuntu/.ssh/cockpit-container-of-souls not found; skipping cos sync."
          fi

          # Step 5: Propagate release to Priority 3 Node (pro @ 35.208.86.56 via prometheus SSH host)
          echo "🛰️ Step 5: Propagating release to Priority 3 Failsafe Slot 2 (pro @ 35.208.86.56)..."
          if ssh prometheus "echo PING" >/dev/null 2>&1; then
            scp "$TARGET_DIR/personal-site-rust" prometheus:"$TARGET_DIR/personal-site-rust.tmp"

            rsync -rlptD --omit-dir-times --no-o --no-g \
              -e "ssh" \
              --exclude "mail" \
              --exclude "backups" \
              --exclude "target" \
              --exclude "node_modules" \
              --exclude ".git" \
              --exclude "*.db*" \
              --exclude "*.tar.gz" \
              --exclude "public/uploads" \
              --exclude "personal-site-rust*" \
              "$TARGET_DIR/" prometheus:"$TARGET_DIR/"

            ssh prometheus "TARGET_DIR=/home/ubuntu/stack/apps/personal-site; cd \$TARGET_DIR && mv -f personal-site-rust.tmp personal-site-rust && chmod +x personal-site-rust && chmod -R a+rX \$TARGET_DIR/public \$TARGET_DIR/frontend/dist 2>/dev/null || true && chmod a+rx \$TARGET_DIR /home/ubuntu /home/ubuntu/stack /home/ubuntu/stack/apps 2>/dev/null || true && mkdir -p backend /home/ubuntu/stack/ops/ipc && touch backend/messages.db && NODE_ROLE=failsafe docker compose up -d --build --remove-orphans && sleep 4 && curl -sS http://127.0.0.1:3002/api/maintenance-status || exit 1"
            echo "✅ Priority 3 (pro) personal-site-rust container is healthy and standing by!"
          else
            echo "⚠️ SSH host prometheus not reachable from my-mac; skipping pro sync."
          fi

          # Step 6: Cascading Hot SQLite Database Sync across cluster: my-mac > cos > pro
          echo "🔄 Step 6: Triggering cascading SQLite DB sync across cluster (my-mac > cos > pro)..."
          if [ -x "/home/ubuntu/scripts/cluster-db-sync.sh" ]; then
            /home/ubuntu/scripts/cluster-db-sync.sh || true
          fi
          REMOTESCRIPT

      - name: "✅ Smoke Test — faizal.uk"
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "⏳ Verifying live production endpoint..."
          SUCCESS=false
          for i in $(seq 1 15); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" -m 5 "https://faizal.uk/api/maintenance-status" || echo "000")
            if [ "$HTTP" = "200" ]; then
              SUCCESS=true
              echo "✅ faizal.uk is live and healthy (HTTP 200 after ${i}s)!"
              break
            fi
            sleep 1
          done
          if [ "$SUCCESS" != "true" ]; then
            echo "⚠️ Checking root endpoint..."
            INDEX_HTTP=$(curl -s -o /dev/null -w "%{http_code}" -m 5 "https://faizal.uk/" || echo "000")
            if [ "$INDEX_HTTP" = "200" ]; then
              echo "✅ faizal.uk main UI is serving HTTP 200!"
            else
              echo "❌ Smoke test FAILED after 15s (status: $HTTP, index: $INDEX_HTTP)"
              exit 1
            fi
          fi
