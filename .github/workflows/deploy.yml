name: Deploy Personal Site (Rust + React)

# Standardized Swarm Deployment Pipeline (modeled after MacOS & Bloomberg Terminal architecture):
# - Auto-triggers on push to master/main or 1-Click manual dispatch with dry-run support
# - Parallel Swarm execution: Node frontend build & Rust cargo compilation run concurrently
# - Full caching layer: npm module cache + Swatinem/rust-cache for sub-minute release builds
# - Artifact-driven release delivery (upload-artifact / download-artifact)
# - Dual-VM Cluster deployment: Primary (my-mac) & Standby (container-of-souls)
# - Container health smoke test validation via /api/maintenance-status

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '.editorconfig'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (Verify build and SSH connectivity without deploying)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: deploy-personal-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight-check:
    name: "🔍 Pre-Flight Secrets & Sanity Check"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Source Code"
        uses: actions/checkout@v4

      - name: "🛡️ Verify Primary VM Secrets"
        if: github.event.inputs.dry_run != 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          echo "Verifying primary deployment credentials..."
          ERRORS=0
          [ -z "$SSH_HOST" ] && echo "❌ ERROR: 'SSH_HOST' is missing in GitHub Secrets!" && ERRORS=$((ERRORS + 1))
          [ -z "$SSH_USER" ] && echo "❌ ERROR: 'SSH_USER' is missing in GitHub Secrets!" && ERRORS=$((ERRORS + 1))
          [ -z "$SSH_KEY" ] && echo "❌ ERROR: 'SSH_KEY' is missing in GitHub Secrets!" && ERRORS=$((ERRORS + 1))
          if [ $ERRORS -gt 0 ]; then
            exit 1
          fi
          echo "✅ Primary node credentials present."

  build-frontend:
    name: "🌐 Swarm Worker: Frontend Build & Admin Bundle"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Source Code"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js 20 with Dependency Caching"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: "⚡ Install & Build React Frontend and Admin Console"
        run: |
          cd frontend
          npm ci --prefer-offline
          # Build Main SPA
          npm run build
          # Build Standalone Admin Console
          npx vite build -c vite.admin.config.js
          # Synchronize dist-admin into public and dist
          cp dist-admin/admin.html ../public/admin.html
          cp -r dist-admin/assets/* ../public/assets/
          cp dist-admin/admin.html dist/admin.html
          cp -r dist-admin/assets/* dist/assets/
          cd ..

      - name: "📦 Upload Frontend Distribution Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

      - name: "📦 Upload Public Assets Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: public-assets
          path: public/
          retention-days: 1

  build-backend:
    name: "🦀 Swarm Worker: Rust Axum Compilation"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Source Code"
        uses: actions/checkout@v4

      - name: "🦀 Setup Rust Toolchain"
        uses: dtolnay/rust-toolchain@stable

      - name: "⚡ Cache Rust Dependencies & Build Artifacts"
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend-rust -> target"

      - name: "🚀 Compile & Strip Release Binary"
        run: |
          cd backend-rust
          cargo build --release
          strip target/release/personal-site-rust
          cd ..
          cp backend-rust/target/release/personal-site-rust ./personal-site-rust
          chmod +x ./personal-site-rust
          ls -lh ./personal-site-rust

      - name: "📦 Upload Backend Binary Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: personal-site-rust
          retention-days: 1

  deploy-primary:
    name: "🔌 Swarm Deploy: Primary Node (my-mac)"
    needs: [preflight-check, build-frontend, build-backend]
    if: github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "📥 Download Frontend Distribution"
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: "📥 Download Public Assets"
        uses: actions/download-artifact@v4
        with:
          name: public-assets
          path: public

      - name: "📥 Download Backend Binary"
        uses: actions/download-artifact@v4
        with:
          name: backend-binary
          path: .

      - name: "📦 Package Compressed Swarm Release Bundle"
        run: |
          chmod +x ./personal-site-rust
          # Package everything into a single compressed bundle for sub-second WAN transfer
          tar -czf release.tar.gz personal-site-rust Dockerfile docker-compose.yml frontend/dist public
          ls -lh release.tar.gz

      - name: "🚀 Deploy & Hot-Reload on Primary Node (my-mac)"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if echo "$SSH_KEY" | grep -q "^LS0t"; then
            echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          elif echo "$SSH_KEY" | grep -q "BEGIN"; then
            echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key 2>/dev/null || echo "$SSH_KEY" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          cat << 'EOF' > ~/.ssh/config
          Host production
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            Port 22
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PubkeyAcceptedKeyTypes +ssh-rsa,rsa-sha2-256,rsa-sha2-512
            HostkeyAlgorithms +ssh-rsa,rsa-sha2-256,rsa-sha2-512
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ConnectTimeout 30
            IPQoS lowdelay
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config

          TARGET_DIR="/home/ubuntu/stack/apps/personal-site"

          echo "⚡ Fast-Streaming release bundle to Primary Node ($TARGET_DIR)..."
          ssh -n production "mkdir -p $TARGET_DIR/backend /home/ubuntu/stack/ops/ipc $TARGET_DIR/public $TARGET_DIR/frontend/dist"

          # Transfer single compressed archive with legacy SCP (-O) to prevent SFTP packet window stalling
          scp -O -C release.tar.gz production:$TARGET_DIR/release.tar.gz

          echo "🐳 Unpacking bundle & launching production container on my-mac..."
          ssh -n production bash -s << 'REMOTESCRIPT'
          set -e
          TARGET_DIR="/home/ubuntu/stack/apps/personal-site"
          cd "$TARGET_DIR"

          # Atomic unpack
          tar -xzf release.tar.gz
          rm -f release.tar.gz

          # Ensure the standby probe SSH tunnel is active
          systemctl is-active --quiet cos-tunnel.service || sudo systemctl restart cos-tunnel.service || true

          # Build and start container (Primary role)
          NODE_ROLE=primary docker compose up -d --build --remove-orphans

          # Verify container health
          sleep 5
          docker ps --filter "name=personal-site-rust"
          curl -sS http://127.0.0.1:3002/api/maintenance-status || exit 1
          echo "✅ Primary personal-site-rust container on my-mac is healthy and serving requests!"
          REMOTESCRIPT

  deploy-standby:
    name: "🛰️ Swarm Deploy: Standby Node (container-of-souls)"
    needs: [preflight-check, build-frontend, build-backend]
    if: github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "📥 Download Frontend Distribution"
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: "📥 Download Public Assets"
        uses: actions/download-artifact@v4
        with:
          name: public-assets
          path: public

      - name: "📥 Download Backend Binary"
        uses: actions/download-artifact@v4
        with:
          name: backend-binary
          path: .

      - name: "📦 Package Compressed Swarm Release Bundle"
        run: |
          chmod +x ./personal-site-rust
          tar -czf release.tar.gz personal-site-rust Dockerfile docker-compose.yml frontend/dist public
          ls -lh release.tar.gz

      - name: "🚀 Deploy & Hot-Reload on Standby Node (container-of-souls)"
        env:
          COS_SSH_HOST: ${{ secrets.COS_SSH_HOST }}
          COS_SSH_USER: ${{ secrets.COS_SSH_USER || 'ubuntu' }}
          COS_SSH_KEY: ${{ secrets.COS_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$COS_SSH_HOST" ] || [ -z "$COS_SSH_KEY" ]; then
            echo "ℹ️ Standby VM (cos) secrets not configured; skipping standby deployment."
            exit 0
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if echo "$COS_SSH_KEY" | grep -q "^LS0t"; then
            echo "$COS_SSH_KEY" | base64 -d > ~/.ssh/cos_deploy_key
          elif echo "$COS_SSH_KEY" | grep -q "BEGIN"; then
            echo "$COS_SSH_KEY" | tr -d '\r' > ~/.ssh/cos_deploy_key
          else
            echo "$COS_SSH_KEY" | base64 -d > ~/.ssh/cos_deploy_key 2>/dev/null || echo "$COS_SSH_KEY" > ~/.ssh/cos_deploy_key
          fi
          chmod 600 ~/.ssh/cos_deploy_key

          cat << 'EOF' > ~/.ssh/config
          Host standby-cos
            HostName ${{ secrets.COS_SSH_HOST }}
            User ${{ secrets.COS_SSH_USER || 'ubuntu' }}
            IdentityFile ~/.ssh/cos_deploy_key
            Port 22
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PubkeyAcceptedKeyTypes +ssh-rsa,rsa-sha2-256,rsa-sha2-512
            HostkeyAlgorithms +ssh-rsa,rsa-sha2-256,rsa-sha2-512
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ConnectTimeout 30
            IPQoS lowdelay
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config

          TARGET_DIR="/home/ubuntu/stack/apps/personal-site"

          echo "⚡ Fast-Streaming release bundle to Standby Node (cos) at $TARGET_DIR..."
          ssh -n standby-cos "mkdir -p $TARGET_DIR/backend /home/ubuntu/stack/ops/ipc $TARGET_DIR/public $TARGET_DIR/frontend/dist"

          # Transfer single compressed archive with legacy SCP (-O) to prevent SFTP packet window stalling
          scp -O -C release.tar.gz standby-cos:$TARGET_DIR/release.tar.gz

          echo "🐳 Unpacking bundle & launching standby Docker container on cos..."
          ssh -n standby-cos bash -s << 'REMOTESCRIPT'
          set -e
          TARGET_DIR="/home/ubuntu/stack/apps/personal-site"
          cd "$TARGET_DIR"

          # Atomic unpack
          tar -xzf release.tar.gz
          rm -f release.tar.gz

          # Ensure messages.db exists so docker bind-mount doesn't create it as a directory
          mkdir -p "$TARGET_DIR/backend"
          touch "$TARGET_DIR/backend/messages.db"

          # Deploy in Standby mode
          NODE_ROLE=standby docker compose up -d --build --remove-orphans

          # Verify container health
          sleep 5
          docker ps --filter "name=personal-site-rust"
          curl -sS http://127.0.0.1:3002/api/maintenance-status || exit 1
          echo "✅ Standby personal-site-rust container on cos is healthy and ready!"
          REMOTESCRIPT
