name: Deploy Personal Site (Rust + React)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (Verify build without deploying)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: deploy-personal-site
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 🌐 Build React Frontend & Standalone Admin
        run: |
          cd frontend
          npm ci
          # Build Main SPA
          npm run build
          # Build Standalone Admin Console
          npx vite build -c vite.admin.config.js
          # Synchronize dist-admin into public and dist
          cp dist-admin/admin.html ../public/admin.html
          cp -r dist-admin/assets/* ../public/assets/
          cp dist-admin/admin.html dist/admin.html
          cp -r dist-admin/assets/* dist/assets/
          cd ..

      - name: ⚡ Build Rust Axum Backend (Optimized Release Binary)
        run: |
          cd backend-rust
          cargo build --release
          strip target/release/personal-site-rust
          cd ..
          cp backend-rust/target/release/personal-site-rust ./personal-site-rust
          chmod +x ./personal-site-rust
          ls -lh ./personal-site-rust

      - name: 🔍 Check Deployment Secrets
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "Verifying deployment secrets..."
          ERRORS=0
          if [ -z "$SSH_HOST" ]; then
            echo "❌ ERROR: 'SSH_HOST' is missing in GitHub Secrets!"
            ERRORS=$((ERRORS + 1))
          fi
          if [ -z "$SSH_USER" ]; then
            echo "❌ ERROR: 'SSH_USER' is missing in GitHub Secrets!"
            ERRORS=$((ERRORS + 1))
          fi
          if [ -z "$SSH_KEY" ]; then
            echo "❌ ERROR: 'SSH_KEY' is missing in GitHub Secrets!"
            ERRORS=$((ERRORS + 1))
          fi
          if [ $ERRORS -gt 0 ]; then
            exit 1
          fi
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}

      - name: 🔌 Setup SSH & Deploy to Production VM
        if: github.event.inputs.dry_run != 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if echo "$SSH_KEY" | grep -q "^LS0t"; then
            echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          elif echo "$SSH_KEY" | grep -q "BEGIN"; then
            echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key 2>/dev/null || echo "$SSH_KEY" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          cat << 'EOF' > ~/.ssh/config
          Host production
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            Port 22
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

          TARGET_DIR="/home/ubuntu/stack/apps/personal-site"

          echo "🚀 Syncing built binary, frontend dist, and configs to $TARGET_DIR..."

          # Upload static stripped binary and docker configs
          scp ./personal-site-rust production:$TARGET_DIR/personal-site-rust
          scp ./Dockerfile ./docker-compose.yml production:$TARGET_DIR/

          # Sync frontend build & public assets
          rsync -avz --delete frontend/dist/ production:$TARGET_DIR/frontend/dist/
          rsync -avz public/ production:$TARGET_DIR/public/

          echo "🐳 Rebuilding and launching production Docker container..."
          ssh production bash -s << 'REMOTESCRIPT'
          set -e
          mkdir -p /home/ubuntu/stack/apps/personal-site/backend
          mkdir -p /home/ubuntu/stack/ops/ipc
          cd /home/ubuntu/stack/apps/personal-site

          # Ensure the standby probe SSH tunnel is active
          systemctl is-active --quiet cos-tunnel.service || sudo systemctl restart cos-tunnel.service || true

          # Build and start container (Primary role)
          NODE_ROLE=primary docker compose up -d --build --remove-orphans

          # Verify container health
          sleep 5
          docker ps --filter "name=personal-site-rust"
          curl -sS http://127.0.0.1:3002/api/maintenance-status || exit 1
          echo "✅ Primary personal-site-rust container on my-mac is healthy and serving requests!"
          REMOTESCRIPT

      - name: 🛰️ Setup SSH & Deploy to Standby VM (container-of-souls)
        if: github.event.inputs.dry_run != 'true' && secrets.COS_SSH_HOST != '' && secrets.COS_SSH_KEY != ''
        env:
          COS_SSH_HOST: ${{ secrets.COS_SSH_HOST }}
          COS_SSH_USER: ${{ secrets.COS_SSH_USER || 'ubuntu' }}
          COS_SSH_KEY: ${{ secrets.COS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if echo "$COS_SSH_KEY" | grep -q "^LS0t"; then
            echo "$COS_SSH_KEY" | base64 -d > ~/.ssh/cos_deploy_key
          elif echo "$COS_SSH_KEY" | grep -q "BEGIN"; then
            echo "$COS_SSH_KEY" | tr -d '\r' > ~/.ssh/cos_deploy_key
          else
            echo "$COS_SSH_KEY" | base64 -d > ~/.ssh/cos_deploy_key 2>/dev/null || echo "$COS_SSH_KEY" > ~/.ssh/cos_deploy_key
          fi
          chmod 600 ~/.ssh/cos_deploy_key

          cat << 'EOF' >> ~/.ssh/config
          Host standby-cos
            HostName ${{ secrets.COS_SSH_HOST }}
            User ${{ secrets.COS_SSH_USER || 'ubuntu' }}
            IdentityFile ~/.ssh/cos_deploy_key
            Port 22
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

          TARGET_DIR="/home/ubuntu/stack/apps/personal-site"

          echo "🚀 Deploying to Standby Node (cos) at $TARGET_DIR..."
          ssh standby-cos "mkdir -p $TARGET_DIR/backend /home/ubuntu/stack/ops/ipc $TARGET_DIR/public"

          # Upload binary, configs, and frontend
          scp ./personal-site-rust standby-cos:$TARGET_DIR/personal-site-rust
          scp ./Dockerfile ./docker-compose.yml standby-cos:$TARGET_DIR/

          rsync -avz --delete frontend/dist/ standby-cos:$TARGET_DIR/frontend/dist/
          rsync -avz public/ standby-cos:$TARGET_DIR/public/

          echo "🐳 Launching standby Docker container on cos..."
          ssh standby-cos bash -s << 'REMOTESCRIPT'
          set -e
          cd /home/ubuntu/stack/apps/personal-site

          # Ensure messages.db exists so docker bind-mount doesn't create it as a directory
          touch /home/ubuntu/stack/apps/personal-site/backend/messages.db

          # Deploy in Standby mode
          NODE_ROLE=standby docker compose up -d --build --remove-orphans

          # Verify container health
          sleep 5
          docker ps --filter "name=personal-site-rust"
          curl -sS http://127.0.0.1:3002/api/maintenance-status || exit 1
          echo "✅ Standby personal-site-rust container on cos is healthy and ready!"
          REMOTESCRIPT
