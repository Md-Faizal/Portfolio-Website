name: Deploy Personal Site (Rust + React)

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (Verify build without deploying)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: deploy-personal-site
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust & Musl
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: 📦 Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 🌐 Build React Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: ⚡ Build Rust Axum Backend (Musl Static Binary)
        run: |
          cd backend-rust
          cargo build --release --target x86_64-unknown-linux-musl
          strip target/x86_64-unknown-linux-musl/release/personal-site-rust
          cd ..
          cp backend-rust/target/x86_64-unknown-linux-musl/release/personal-site-rust ./personal-site-rust
          chmod +x ./personal-site-rust
          ls -lh ./personal-site-rust

      - name: 🔍 Check Deployment Secrets
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "Verifying deployment secrets..."
          ERRORS=0
          if [ -z "$SSH_HOST" ]; then
            echo "❌ ERROR: 'SSH_HOST' is missing in GitHub Secrets!"
            ERRORS=$((ERRORS + 1))
          fi
          if [ -z "$SSH_USER" ]; then
            echo "❌ ERROR: 'SSH_USER' is missing in GitHub Secrets!"
            ERRORS=$((ERRORS + 1))
          fi
          if [ -z "$SSH_KEY" ]; then
            echo "❌ ERROR: 'SSH_KEY' is missing in GitHub Secrets!"
            ERRORS=$((ERRORS + 1))
          fi
          if [ $ERRORS -gt 0 ]; then
            exit 1
          fi
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}

      - name: 🔌 Setup SSH & Deploy to VM
        if: github.event.inputs.dry_run != 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if echo "$SSH_KEY" | grep -q "^LS0t"; then
            echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          elif echo "$SSH_KEY" | grep -q "BEGIN"; then
            echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key 2>/dev/null || echo "$SSH_KEY" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          cat << 'EOF' > ~/.ssh/config
          Host production
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            Port 22
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

          TARGET_DIR="/home/ubuntu/faizal.uk"

          echo "🚀 Syncing built binary, frontend dist, and configs to $TARGET_DIR..."

          # Stop old PM2 node process if running to free port 3002 and RAM
          ssh production "pm2 stop personal-site 2>/dev/null && pm2 delete personal-site 2>/dev/null && pm2 save || true"

          # Upload static stripped binary and docker configs
          scp ./personal-site-rust production:$TARGET_DIR/personal-site-rust
          scp ./Dockerfile ./docker-compose.yml production:$TARGET_DIR/

          # Sync frontend build & public assets
          rsync -avz --delete frontend/dist/ production:$TARGET_DIR/frontend/dist/
          rsync -avz public/ production:$TARGET_DIR/public/

          echo "🐳 Launching optimized Docker container..."
          ssh production bash -s << 'REMOTESCRIPT'
          set -e
          cd /home/ubuntu/faizal.uk

          # Build and start container (pre-compiled binary copies into alpine:3.20 in seconds)
          docker compose up -d --build --remove-orphans

          # Verify container health
          sleep 5
          docker ps --filter "name=personal-site-rust"
          curl -sS http://127.0.0.1:3002/api/maintenance-status || exit 1
          echo "✅ Production personal-site-rust container is healthy and serving requests!"
          REMOTESCRIPT
