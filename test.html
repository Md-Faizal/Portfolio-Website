<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammad Faizal</title>
</head>

<body
    style="margin: 0; padding: 0; background-color: #000000; font-family: 'Space Mono', 'Spline Sans Mono', 'Consolas', monospace; -webkit-font-smoothing: antialiased; color: #ffffff;">

    <!-- Minimal Outer Canvas -->
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"
        style="background-color: #000000; padding: 48px 16px;">
        <tr>
            <td align="center">

                <!-- Pure Angular Card Container (Beveled Corners matching FZ Monogram) -->
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"
                    style="max-width: 540px; background-color: #0a0a0c; border: 1px solid #222423; clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);">

                    <!-- Top Neon Cyber Line -->
                    <tr>
                        <td height="2" style="background: linear-gradient(90deg, #89ff00, #C3004F, #222423); font-size: 0; line-height: 0;">&nbsp;</td>
                    </tr>

                    <!-- Angular Header: Monogram & Identity -->
                    <tr>
                        <td style="padding: 32px 36px 24px 36px; border-bottom: 1px solid #1a1a1e;">
                            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <!-- Vector Monogram -->
                                    <td width="48" valign="middle">
                                        <a href="https://faizal.uk" target="_blank" style="text-decoration: none; display: inline-block;">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 171.63 91" width="46" height="24" style="display: block;">
                                                <g>
                                                    <path fill="#89ff00" stroke="#000000" stroke-miterlimit="10" d="M43.82,70.3l64.52.05,5.42-12.76-32.78-.36,41.09-19.08,7.56-18.43,27.69.85-25.84,61.15c-2.63,6.23-11.43,8.64-18.18,8.65l-111.12.13,41.64-20.2Z"/>
                                                    <path fill="#89ff00" stroke="#000000" stroke-miterlimit="10" d="M129.63,19.71l-65.22.74-5.49,12.65,32.87.55-41.14,19.05-6.83,17.6-28.38-.02L41.22,9.13C43.67,3.32,52.08.55,58.48.55l110.96-.05-39.82,19.21Z"/>
                                                    <polygon fill="#201d1a" points="44.55 69.8 51.04 53.07 93.98 33.19 59.67 32.61 64.74 20.95 128.88 20.22 121.68 37.77 78.77 57.7 113 58.08 108.01 69.85 44.55 69.8"/>
                                                    <path fill="#ffffff" d="M128.13,20.73l-6.84,16.67-40.73,18.92-4,1.86,4.41.05,31.28.34-4.57,10.78-62.4-.05,6.16-15.86,40.77-18.88,3.96-1.83-4.36-.07-31.37-.53,4.64-10.68,63.06-.71M129.63,19.71l-6.84,16.67-40.73,18.92-4,1.86,4.41.05,31.28.34-4.57,10.78-62.4-.05,6.16-15.86,40.77-18.88,3.96-1.83-4.36-.07-31.37-.53,4.64-10.68,63.06-.71Z"/>
                                                </g>
                                            </svg>
                                        </a>
                                    </td>

                                    <!-- Identity Text -->
                                    <td valign="middle" style="padding-left: 14px;">
                                        <div style="font-size: 14px; font-weight: 700; letter-spacing: 0.14em; color: #ffffff; text-transform: uppercase;">
                                            MOHAMMAD FAIZAL
                                        </div>
                                        <div style="font-size: 10px; color: #C3004F; letter-spacing: 0.12em; text-transform: uppercase; margin-top: 2px;">
                                            FAIZAL.UK // ATELIER
                                        </div>
                                    </td>

                                    <!-- Angular Status Badge -->
                                    <td align="right" valign="middle">
                                        <span style="font-size: 10px; color: #89ff00; letter-spacing: 0.1em; border: 1px solid rgba(137, 255, 0, 0.3); padding: 3px 8px; clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); background: rgba(137, 255, 0, 0.05);">
                                            [ ONLINE ]
                                        </span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Minimalist Message Body (No Filler Text) -->
                    <tr>
                        <td style="padding: 32px 36px 36px 36px;">

                            <!-- Sharp Headline -->
                            <div style="font-size: 18px; font-weight: 700; color: #ffffff; letter-spacing: -0.01em; margin-bottom: 14px; font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;">
                                Message Received.
                            </div>

                            <!-- Concise Need-To-Know Copy -->
                            <p style="margin: 0 0 14px 0; font-size: 13.5px; line-height: 1.7; color: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;">
                                Your note reached my personal desk. I will review and reply within 24 hours.
                            </p>

                            <!-- Angular Metadata Box -->
                            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"
                                style="margin: 24px 0; background: #121316; border-left: 2px solid #89ff00; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);">
                                <tr>
                                    <td style="padding: 14px 18px; font-size: 11px; line-height: 1.6; color: #94a3b8;">
                                        <span style="color: #757164;">SENDER:</span> <span style="color: #ffffff;">me@faizal.uk</span><br>
                                        <span style="color: #757164;">STATUS:</span> <span style="color: #89ff00;">AUTHENTICATED // DIRECT ROUTE</span>
                                    </td>
                                </tr>
                            </table>

                            <!-- Angular Button -->
                            <table role="presentation" border="0" cellpadding="0" cellspacing="0" style="margin: 22px 0 28px 0;">
                                <tr>
                                    <td>
                                        <a href="https://faizal.uk" target="_blank"
                                            style="display: inline-block; padding: 10px 22px; background: #C3004F; color: #ffffff; font-size: 11px; font-weight: 700; text-decoration: none; letter-spacing: 0.12em; text-transform: uppercase; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); border: 1px solid rgba(255, 255, 255, 0.2);">
                                            VISIT FAIZAL.UK &rarr;
                                        </a>
                                    </td>
                                </tr>
                            </table>

                            <!-- Clean Sign-Off -->
                            <div style="font-size: 12px; color: #757164; letter-spacing: 0.08em; text-transform: uppercase;">
                                &mdash; Mohammad Faizal
                            </div>

                        </td>
                    </tr>

                    <!-- Angular Bottom Footer -->
                    <tr>
                        <td style="padding: 16px 36px 20px 36px; background-color: #060608; border-top: 1px solid #141416; text-align: left;">
                            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td style="font-size: 10px; color: #52525b; letter-spacing: 0.1em; text-transform: uppercase;">
                                        &copy; 2026 FAIZAL.UK
                                    </td>
                                    <td align="right">
                                        <a href="https://faizal.uk" target="_blank" style="font-size: 10px; color: #757164; text-decoration: none; margin-left: 12px; letter-spacing: 0.08em;">WORK</a>
                                        <a href="https://faizal.uk" target="_blank" style="font-size: 10px; color: #757164; text-decoration: none; margin-left: 12px; letter-spacing: 0.08em;">CONTACT</a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                </table>
                <!-- End Card -->

            </td>
        </tr>
    </table>

</body>

</html>
