    <!-- Instant Cyber HUD Shell Styling (Zero Network Latency, FCP < 20ms) -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #000000;
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
      }
      #app-shell-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background-color: #000000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        pointer-events: none;
        transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s ease;
      }
      #app-shell-preloader.dismissed {
        opacity: 0;
        visibility: hidden;
      }
      .shell-hud-corners-wrap {
        position: absolute;
        inset: clamp(12px, 2.5vw, 28px);
        pointer-events: none;
        z-index: 20;
      }
      .shell-dot-matrix {
        display: grid;
        grid-template-columns: repeat(3, 4px);
        grid-gap: 4px;
        pointer-events: none;
      }
      .shell-dot {
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background-color: #55ff00;
        opacity: 0.45;
        box-shadow: 0 0 4px rgba(85, 255, 0, 0.6);
      }
      
      .shell-center-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
        position: relative;
        width: 100%;
        max-width: 560px;
        padding: 0 1rem;
        box-sizing: border-box;
      }
      .shell-logo-icon {
        width: clamp(118px, 20vw, 198px);
        height: clamp(62px, 10.6vw, 106px);
        margin-bottom: clamp(1.8rem, 5vh, 4.2rem);
      }
      .shell-counter-num {
        font-family: "Chakra Petch", sans-serif;
        font-weight: 400;
        font-size: clamp(3.6rem, 10vw, 7.2rem);
        color: #ffffff;
        line-height: 0.95;
        letter-spacing: 0.02em;
        text-shadow: 0 0 25px rgba(255, 255, 255, 0.35);
        text-align: center;
      }
      .shell-bar-wrap {
        width: clamp(220px, 64vw, 360px);
        height: 3px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(85, 255, 0, 0.18);
        border-radius: 2px;
        margin-top: clamp(1.2rem, 2.8vh, 1.8rem);
        position: relative;
        box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.8);
        box-sizing: content-box;
        display: flex;
        align-items: center;
      }
      .shell-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #39ff14 0%, #55ff00 100%);
        border-radius: 2px;
        width: 0%;
        box-shadow: 0 0 10px #55ff00, 0 0 20px rgba(85, 255, 0, 0.6);
        transition: width 0.1s linear;
      }
      .shell-bar-flare {
        position: absolute;
        top: 50%;
        left: 0%;
        transform: translate(-50%, -50%);
        width: 7px;
        height: 7px;
        background: #ffffff;
        border-radius: 50%;
        box-shadow: 0 0 10px 2px #55ff00, 0 0 22px 6px rgba(85, 255, 0, 0.9), 0 0 38px 10px rgba(85, 255, 0, 0.4);
        transition: left 0.1s linear;
      }
      .shell-loading-text {
        font-family: "Share Tech Mono", monospace;
        font-weight: 500;
        font-size: clamp(0.78rem, 2.0vw, 1.25rem);
        letter-spacing: clamp(0.28em, 0.9vw, 0.42em);
        color: #55ff00;
        text-transform: uppercase;
        margin-top: clamp(1.2rem, 2.8vh, 1.9rem);
        text-align: center;
        white-space: nowrap;
        text-shadow: 0 0 12px #55ff00, 0 0 24px rgba(85, 255, 0, 0.7), 0 0 36px rgba(85, 255, 0, 0.35);

    <!-- Immediate Cyber HUD Shell Preloader -->
    <div id="app-shell-preloader" aria-hidden="true">
      <!-- Outward <> Chevrons Overlay (Slower Aerodynamic Pulses + Sharp Pointy Tails + Reactive Facet Surges) -->
      <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 5; pointer-events: none;">
        <style>
          /* Fast, energetic aerodynamic pulse sweep (1.2s cycle with 0.35s stagger) */
          @keyframes pulseMiddleToBottom {
            0% {
              stroke-dashoffset: 180;
              opacity: 0;
            }
            5% {
              opacity: 1;
            }
            38% {
              stroke-dashoffset: -880;
              opacity: 1;
            }
            42% {
              opacity: 0;
              stroke-dashoffset: -880;
            }
            100% {
              opacity: 0;
              stroke-dashoffset: -880;
            }
          }

          /* Inward-to-Outward Loading Wave Glow for Facet Polygons */
          @keyframes loadingWaveFacet {
            0% {
              opacity: 0.35;
            }
            20% {
              opacity: 0.95;
            }
            45% {
              opacity: 0.35;
            }
            100% {
              opacity: 0.35;
            }
          }

          /* Inward-to-Outward Loading Wave for Neon Baseline Lines */
          @keyframes loadingWaveLine {
            0% {
              opacity: 0.55;
            }
            20% {
              opacity: 1;
            }
            45% {
              opacity: 0.55;
            }
            100% {
              opacity: 0.55;
            }
          }

          /* Aerodynamic Layering Dash Arrays */
          .aero-tail {
            stroke-dasharray: 230 950;
          }
          .aero-body {
            stroke-dasharray: 125 950;
          }
          .aero-head-bloom {
            stroke-dasharray: 55 950;
          }
          .aero-core {
            stroke-dasharray: 28 950;
          }

          /* Sequential Flow: Innermost (0s) -> Middle (0.35s) -> Outermost (0.70s) in 1.2s Cycle */
          .pulse-wave-inner {
            animation: pulseMiddleToBottom 1.2s cubic-bezier(0.22, 0.75, 0.3, 1) infinite;
            animation-delay: 0s;
          }
          .pulse-wave-mid {
            animation: pulseMiddleToBottom 1.2s cubic-bezier(0.22, 0.75, 0.3, 1) infinite;
            animation-delay: 0.35s;
          }
          .pulse-wave-outer {
            animation: pulseMiddleToBottom 1.2s cubic-bezier(0.22, 0.75, 0.3, 1) infinite;
            animation-delay: 0.70s;
          }

          /* Linked Inward-to-Outward Facet Glow Wave */
          .facet-wave-inner {
            animation: loadingWaveFacet 1.2s cubic-bezier(0.22, 0.75, 0.3, 1) infinite;
            animation-delay: 0s;
          }
          .facet-wave-mid {
            animation: loadingWaveFacet 1.2s cubic-bezier(0.22, 0.75, 0.3, 1) infinite;
            animation-delay: 0.35s;
          }
          .facet-wave-outer {
            animation: loadingWaveFacet 1.2s cubic-bezier(0.22, 0.75, 0.3, 1) infinite;
            animation-delay: 0.70s;
          }

          /* Linked Inward-to-Outward Line Glow Wave */
          .line-wave-inner {
            animation: loadingWaveLine 1.2s cubic-bezier(0.22, 0.75, 0.3, 1) infinite;
            animation-delay: 0s;
          }
          .line-wave-mid {
            animation: loadingWaveLine 1.2s cubic-bezier(0.22, 0.75, 0.3, 1) infinite;
            animation-delay: 0.35s;
          }
          .line-wave-outer {
            animation: loadingWaveLine 1.2s cubic-bezier(0.22, 0.75, 0.3, 1) infinite;
            animation-delay: 0.70s;
          }

          /* Responsive Dual-Mode Shell SVG Display Engine (Runs Instant at FCP 0ms) */
          .shell-svg-desktop {
            display: none !important;
          }
          .shell-svg-mobile {
            display: block !important;
          }
          @media (min-width: 768px) {
            .shell-svg-desktop {
              display: block !important;
            }
            .shell-svg-mobile {
              display: none !important;

    <!-- Instant Shell Progress Micro-Engine (Runs before React scripts download) -->
    <script>
      (function() {
        window.__SHELL_PROGRESS__ = 0;
        var start = performance.now();
        var valEl = document.getElementById('shell-counter-val');
        var fillEl = document.getElementById('shell-bar-fill');
        var flareEl = document.getElementById('shell-bar-flare');
        var cur = 0;
        
        function tick(now) {
          if (document.getElementById('app-shell-preloader')?.classList.contains('dismissed')) return;
          var elapsed = now - start;
          // Smooth progressive target
          var target = Math.min(85, Math.round((elapsed / 1800) * 85));
          if (target > cur) {
            cur += Math.min(1, target - cur);
          }
          window.__SHELL_PROGRESS__ = cur;
          if (valEl) valEl.innerHTML = cur + '%';
          if (fillEl) fillEl.style.width = cur + '%';
          if (flareEl) flareEl.style.left = cur + '%';
          if (cur < 85) {
            requestAnimationFrame(tick);
          }
        }
        requestAnimationFrame(tick);
      })();
    </script>
