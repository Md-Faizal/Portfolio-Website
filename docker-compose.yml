services:
  personal-site:
    container_name: personal-site-rust
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: personal-site:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=3002
      - ADMIN_PIN=2004
      - RUST_LOG=info
      - TZ=UTC
      - NODE_ROLE=${NODE_ROLE:-primary}
      # ── SMTP via Brevo Relay (port 587 STARTTLS, bypasses OCI port 25 block) ─
      - SMTP_HOST=smtp-relay.brevo.com
      - SMTP_PORT=587
      - SMTP_USER=bb6408001@smtp-brevo.com
      - SMTP_PASS=xsmtpsib-73f7e08afbd853d9e9d2e8c2049f93badd7e7f2b34e3e9de937eee1a307cace3-cmEy8jEk90T1HM6Z
      - SMTP_TLS=starttls
      - SENDER_EMAIL=reports@faizal.uk
      - SENDER_NAME=Faizal VM Health Monitor
    volumes:
      # Persistent SQLite database — survives container restarts
      - /home/ubuntu/stack/apps/personal-site/backend/messages.db:/app/messages.db
      # Dynamic uploads (profile pics, project images)
      - /home/ubuntu/stack/apps/personal-site/public:/app/public
      # Read-only Docker socket — lets health engine inspect sibling containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/ubuntu/stack/ops/ipc:/run/stack-service-ipc
      - /usr/local/bin/docker-static:/usr/local/bin/docker:ro
    deploy:
      resources:
        limits:
          memory: 48M
        reservations:
          memory: 8M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

