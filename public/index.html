<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faizal's Site</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0b0b0c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', -apple-system, sans-serif;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <script>
        (async () => {
            try {
                const response = await fetch('/api/theme-config');
                const data = await response.json();
                const theme = data.theme || 'classic';
                
                if (theme === 'vibrant') {
                    window.location.href = '/vibrant.html';
                } else {
                    window.location.href = '/index-classic.html';
                }
            } catch (error) {
                console.error('Theme routing failed:', error);
                window.location.href = '/index-classic.html';
            }
        })();
    </script>
</body>
</html>
