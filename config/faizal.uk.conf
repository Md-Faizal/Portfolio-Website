# Map Cloudflare or HTTPS proxy proto
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name faizal.uk www.faizal.uk autoconfig.faizal.uk autodiscover.faizal.uk _;
    root /home/ubuntu/faizal.uk/public;
    index index.html;
    client_max_body_size 0;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /images/ {
        alias /home/ubuntu/faizal.uk/public/images/;
        autoindex off;
    }

    # Personal site backend endpoints (explicitly listed)
    location /save-message {
        proxy_pass http://127.0.0.1:3002/save-message;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location ~* ^/api/(maintenance-status|theme-config|upload-picture|profile-pic|profile-history|select-profile-pic|use-history-pic|track-visit|system-stats|projects|project-image|access-logs|ban-ip|banned-ips|settings|test-email|verify-pin|messages|health-report) {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    # Personal Site Admin Panel
    location = /admin.html {
        try_files /admin.html =404;
    }

    # Stalwart All-inclusive Web Admin, API, Auth, and Protocols
    location ~* ^/(admin/|admin$|account|login|logout|assets|auth|api/|jmap|\.well-known|logo|favicon\.ico) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        client_max_body_size 50M;
    }

    location /mail/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        client_max_body_size 50M;
    }

    location = /mail {
        return 301 /admin/;
    }
}
